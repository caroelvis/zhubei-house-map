<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>竹北建商建案地圖 · 坤山／德鑫／椰林</title>
  <meta name="description" content="坤山、德鑫、椰林在竹北市的住宅建案：完工年、權狀／室內坪、最近一筆實價登錄與目前在售物件。" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="icon" href="data:," />
  <style>
:root {
  --bg: #f4f1eb; --surface: #fffcf7; --surface-2: #f7f3ec; --ink: #1c2429; --ink-soft: #5a6670;
  --muted: #8a949c; --line: #e4ddd2; --accent: #2f5d50; --accent-soft: #e8f1ee; --accent-deep: #1e3f36;
  --leju: #e4007f; --o591: #ff6a00; --sinyi: #c8a400; --warn: #b42318;
  --e1: #6b7280; --e2: #2563eb; --e3: #0f9d58; --pre: #7c3aed; --star: #d97706; --fit: #e7f6ec; --fit-ink: #146c3a;
  --bks: #8a5a12; --bdx: #b91c1c; --byl: #0f766e; --e0: #9ca3af;
  --shadow: 0 10px 40px rgba(28,36,41,.08); --radius: 12px;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
body { overflow: hidden; }
a { color: inherit; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; height: 100dvh; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: .4rem 1rem; padding: .6rem 1rem; flex-wrap: wrap;
  background: linear-gradient(180deg, #fffdf9 0%, var(--surface) 100%); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .7rem; }
.brand-mark { width: 2rem; height: 2rem; border-radius: 10px; flex-shrink: 0; background: linear-gradient(145deg, var(--e1), var(--e2) 45%, var(--e3) 75%, var(--pre)); }
.brand h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
.subtitle { margin: .1rem 0 0; font-size: .76rem; color: var(--ink-soft); }
.legend { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; }
.legend-chip { display: inline-flex; align-items: center; gap: .25rem; font-size: .72rem; color: var(--ink-soft); white-space: nowrap; }
.dot { width: .75rem; height: .75rem; border-radius: 3px; display: inline-block; }
.dot.e1 { background: var(--e1); } .dot.e2 { background: var(--e2); } .dot.e3 { background: var(--e3); } .dot.pre { background: var(--pre); }
.sale-chip { font-style: normal; background: var(--warn); color: #fff; border-radius: 8px; padding: 0 5px; font-size: .66rem; font-weight: 700; }
.star { color: var(--star); font-style: normal; }

.workspace { display: grid; grid-template-columns: 1fr minmax(340px, 410px); min-height: 0; }
.map-pane { min-width: 0; min-height: 0; position: relative; }
#map { width: 100%; height: 100%; background: #d9e2dc; }
.side-pane { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.sheet-handle { display: none; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.tab { font: inherit; font-size: .86rem; font-weight: 700; padding: .55rem; border: 0; background: none; color: var(--ink-soft); cursor: pointer; border-bottom: 3px solid transparent; }
.tab.active { color: var(--accent-deep); border-bottom-color: var(--accent); background: #fff; }
.tab small { font-weight: 500; color: var(--muted); }
.controls { display: grid; gap: .5rem; padding: .6rem .85rem; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.controls[hidden] { display: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; align-items: end; }
.field { display: grid; gap: .2rem; font-size: .72rem; color: var(--ink-soft); font-weight: 600; }
.field select { width: 100%; font: inherit; font-size: .86rem; font-weight: 500; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
.checks { display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
.field-check { display: flex; align-items: center; gap: .4rem; font-size: .8rem; color: var(--ink); cursor: pointer; }
.field-check input { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; margin: 0; }
.fit-only { padding-bottom: .35rem; font-size: .76rem; }
.hint { margin: 0; font-size: .7rem; color: var(--ink-soft); display: flex; align-items: center; gap: .3rem; }
.fit-swatch { width: .8rem; height: .8rem; background: var(--fit); border: 1px solid #a7dcb9; border-radius: 3px; display: inline-block; }

.scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
.list { padding: .6rem; display: flex; flex-direction: column; gap: .5rem; }
.empty { color: var(--ink-soft); font-size: .85rem; padding: 1rem; text-align: center; }
.card { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--e1)); border-radius: var(--radius); background: #fff; padding: .6rem .7rem; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card:hover { box-shadow: var(--shadow); }
.card.active { box-shadow: 0 0 0 3px rgba(47,93,80,.18), var(--shadow); }
.card.e1 { --c: var(--e1); } .card.e2 { --c: var(--e2); } .card.e3 { --c: var(--e3); } .card.pre { --c: var(--pre); }
.card.star-card { background: linear-gradient(90deg, #fff4e0 0%, #fff 45%); }
.card-head { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
.cname { margin: 0; font-size: .96rem; font-weight: 700; line-height: 1.3; }
.cyear { font-size: .75rem; color: var(--c); font-weight: 700; margin-left: .3rem; }
.cunit { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--accent-deep); }
.cunit small { font-weight: 500; color: var(--muted); font-size: .68rem; }
.cmeta { margin-top: .25rem; display: flex; flex-wrap: wrap; gap: .2rem .3rem; font-size: .72rem; }
.tag { display: inline-flex; align-items: center; padding: .05rem .4rem; border-radius: 6px; background: var(--surface-2); color: var(--ink-soft); }
.tag-zone { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
.tag-sale { background: #fdecea; color: var(--warn); font-weight: 700; }
.tag-fit { background: var(--fit); color: var(--fit-ink); font-weight: 700; }
.tag-est { background: #fff4e0; color: #9a5b00; font-weight: 600; }

/* listing cards */
.lcard { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; padding: .55rem .7rem; }
.lcard.fit { background: var(--fit); border-color: #a7dcb9; }
.lcard-top { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
.lname { font-weight: 700; font-size: .9rem; cursor: pointer; color: var(--accent-deep); text-decoration: underline dotted; text-underline-offset: 3px; }
.lprice { font-weight: 800; font-size: 1.02rem; white-space: nowrap; text-decoration: none; color: var(--ink); font-variant-numeric: tabular-nums; }
.lprice.u4000 { color: #157a41; } .lprice.o4000 { color: #b9590a; }
.lprice:after { content: " ↗"; font-size: .7rem; color: var(--muted); }
.lgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .15rem .4rem; margin-top: .35rem; font-size: .76rem; }
.lgrid div { display: grid; } .lgrid span { color: var(--muted); font-size: .66rem; } .lgrid b { font-variant-numeric: tabular-nums; font-weight: 600; }
.lnote { font-size: .68rem; color: var(--ink-soft); margin-top: .25rem; line-height: 1.4; }

.side-foot { padding: .6rem .9rem 1.2rem; border-top: 1px solid var(--line); background: var(--surface-2); font-size: .7rem; color: var(--ink-soft); line-height: 1.5; }
.side-foot p { margin: 0 0 .35rem; }
.side-foot a { color: var(--accent-deep); }
.side-foot .warn { color: var(--warn); font-weight: 700; }

/* ---- price-tag pins ---- */
.tag-icon { background: none; border: none; }
.ptag { position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 7px)); white-space: nowrap; display: inline-flex; align-items: stretch;
  border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.28); font-size: 12px; line-height: 1; cursor: pointer; font-family: var(--font); transition: transform .12s; }
.ptag::after { content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); border: 7px solid transparent; border-bottom: 0; border-top-color: var(--pc); }
.ptag .pn { background: #fff; color: #1c2429; padding: 5px 6px; border-radius: 6px 0 0 6px; font-weight: 700; border: 2px solid var(--pc); border-right: 0; }
.ptag .py { background: var(--pc); color: #fff; padding: 5px 6px; border-radius: 0 6px 6px 0; font-weight: 700; font-variant-numeric: tabular-nums; border: 2px solid var(--pc); border-left: 0; }
.ptag .pu { background: #fff; color: var(--pc); padding: 5px 5px; font-weight: 700; border-top: 2px solid var(--pc); border-bottom: 2px solid var(--pc); font-variant-numeric: tabular-nums; }
.ptag .ps { position: absolute; top: -9px; right: -9px; background: var(--warn); color: #fff; border: 2px solid #fff; border-radius: 9px; padding: 2px 5px; font-size: 10px; font-weight: 800; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.ptag .pstar { color: var(--star); margin-right: 2px; font-size: 13px; }
.ptag.e1 { --pc: var(--e1); } .ptag.e2 { --pc: var(--e2); } .ptag.e3 { --pc: var(--e3); } .ptag.pre { --pc: var(--pre); }
.ptag.starred { box-shadow: 0 0 0 3px rgba(217,119,6,.45), 0 3px 10px rgba(0,0,0,.35); }
.ptag.starred .pn { border-color: var(--star); }
.ptag:hover, .ptag.active { transform: translate(-50%, calc(-100% - 7px)) scale(1.08); }
.ptag.active .pn { background: #1c2429; color: #fff; }
.leaflet-marker-icon.on-top { z-index: 100000 !important; }

.pdot { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); min-width: 18px; height: 18px; padding: 0 3px; border-radius: 10px;
  border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); color: #fff; font-size: 10px; font-weight: 800; line-height: 14px; text-align: center; cursor: pointer; font-family: var(--font); }
.pdot.e1 { background: var(--e1); } .pdot.e2 { background: var(--e2); } .pdot.e3 { background: var(--e3); } .pdot.pre { background: var(--pre); }
.pdot.starred { background: var(--star); }
.pdot:hover { transform: translate(-50%, -50%) scale(1.3); }
/* popup */
.leaflet-popup-content { margin: 11px 12px; font-family: var(--font); font-size: .8rem; line-height: 1.45; }
.leaflet-popup-content-wrapper { border-radius: 12px; }
.pop-title { font-size: 1.02rem; font-weight: 800; margin: 0 1.1rem .1rem 0; }
.pop-alias { font-size: .72rem; color: var(--muted); margin-bottom: .2rem; }
.pop-sub { display: flex; flex-wrap: wrap; gap: .2rem; margin-bottom: .3rem; }
.pop-scroll { max-height: 52vh; overflow: auto; -webkit-overflow-scrolling: touch; padding-right: 2px; }
.sec { margin-top: .45rem; }
.sec h4 { margin: 0 0 .2rem; font-size: .76rem; color: var(--accent-deep); border-bottom: 1px solid var(--line); padding-bottom: .1rem; }
dl.kv { display: grid; grid-template-columns: 4.2em 1fr; gap: .1rem .4rem; margin: 0; font-size: .76rem; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; }
.tx { background: var(--surface-2); border-radius: 8px; padding: .4rem .5rem; }
.tx-big { font-size: .95rem; font-weight: 800; }
.tx-unit { color: var(--accent-deep); font-weight: 800; }
.est { display: inline-block; font-size: .66rem; background: #fff4e0; color: #9a5b00; border-radius: 4px; padding: 0 .3rem; font-weight: 700; margin-left: .2rem; }
ul.pl { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
ul.pl li a { display: grid; grid-template-columns: 3.6em 4.6em 1fr; gap: .3rem; align-items: baseline; text-decoration: none; padding: .3rem .4rem; border-radius: 7px; border: 1px solid var(--line); background: #fff; }
ul.pl li a.fit { background: var(--fit); border-color: #a7dcb9; }
ul.pl li a:hover { border-color: var(--accent); }
ul.pl .f { font-weight: 700; } ul.pl .t { font-weight: 800; color: var(--ink); } ul.pl .a { color: var(--ink-soft); font-size: .72rem; }
ul.notes { margin: 0; padding-left: 1.1em; font-size: .72rem; color: var(--ink-soft); }
.btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: .35rem; margin-top: .55rem; }
.btn { display: flex; align-items: center; justify-content: center; padding: .5rem .4rem; border-radius: 9px; color: #fff !important; font-weight: 700; font-size: .8rem; text-decoration: none; text-align: center; }
.btn.leju { background: var(--leju); box-shadow: 0 2px 6px rgba(228,0,127,.3); }
.btn.b591 { background: var(--o591); } .btn.sinyi { background: #b38f00; }
.btn:hover { filter: brightness(1.08); }
.geo { font-size: .64rem; color: var(--muted); margin-top: .35rem; }

@media (max-width: 760px) {
  .topbar { padding: .45rem .7rem; }
  .brand-mark { display: none; }
  .brand h1 { font-size: .98rem; }
  .legend { gap: .2rem .5rem; }
  .legend-chip { font-size: .66rem; }
  .hint-d { display: none; }
  .subtitle { font-size: .7rem; }
  .workspace { display: block; position: relative; height: 100%; }
  .map-pane { position: absolute; inset: 0; }
  .side-pane { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; height: 82dvh; border-left: 0; border-radius: 16px 16px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,.18); transform: translateY(calc(100% - var(--peek, 34dvh))); transition: transform .25s ease; }
  .side-pane.expanded { transform: translateY(0); }
  .side-pane.collapsed { transform: translateY(calc(100% - 52px)); }
  .sheet-handle { display: flex; flex-direction: column; align-items: center; gap: .2rem; border: 0; background: var(--surface); padding: .45rem 0 .3rem; border-radius: 16px 16px 0 0; cursor: pointer; font: inherit; }
  .sheet-handle span { width: 42px; height: 5px; border-radius: 3px; background: #cfc5b5; }
  .sheet-handle b { font-size: .78rem; color: var(--ink-soft); }
  .tab { padding: .45rem; }
  .row2 { gap: .45rem; }
  .leaflet-popup-content { margin: 10px 10px; }
  .pop-scroll { max-height: 42dvh; }
}

/* ---- builders ---- */
.btabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem; width: 100%; order: 3; }
.btab { font: inherit; font-size: .84rem; font-weight: 700; padding: .42rem .2rem; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink-soft); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .25rem; }
.btab small { font-weight: 500; color: var(--muted); }
.btab.active { background: var(--accent-deep); color: #fff; border-color: var(--accent-deep); }
.btab.active small { color: #d6e5df; }
.bmini { font-style: normal; display: inline-flex; align-items: center; justify-content: center; width: 1.15rem; height: 1.15rem; font-size: .66rem; font-weight: 800; color: #fff; margin-right: .2rem; vertical-align: middle; }
.bmini.b-ks { background: var(--bks); border-radius: 4px; } .bmini.b-dx { background: var(--bdx); border-radius: 0; } .bmini.b-yl { background: var(--byl); border-radius: 50%; }
.tag-b { color: #fff; font-weight: 700; }
.tag-b.b-ks { background: var(--bks); } .tag-b.b-dx { background: var(--bdx); border-radius: 0; } .tag-b.b-yl { background: var(--byl); border-radius: 9px; }
.ptag .pb { color: #fff; padding: 5px 4px; font-weight: 800; border: 2px solid var(--bc); background: var(--bc); }
.ptag.b-ks { --bc: var(--bks); } .ptag.b-dx { --bc: var(--bdx); } .ptag.b-yl { --bc: var(--byl); }
.ptag.b-ks .pb { border-radius: 6px 0 0 6px; }
.ptag .pn { border-radius: 0 !important; border-left: 0 !important; }
.ptag.b-dx, .ptag.b-dx .pb, .ptag.b-dx .py { border-radius: 0 !important; }
.ptag.b-dx { outline: 2px solid var(--bdx); outline-offset: 0; }
.ptag.b-yl { border-radius: 999px; }
.ptag.b-yl .pb { border-radius: 999px 0 0 999px; padding-left: 7px; }
.ptag.b-yl .py { border-radius: 0 999px 999px 0; padding-right: 8px; }
.ptag.e0 { --pc: var(--e0); } .pdot.e0 { background: var(--e0); } .card.e0 { --c: var(--e0); } .dot.e0 { background: var(--e0); }
.pdot.b-ks { border-color: var(--bks); border-radius: 5px; } .pdot.b-dx { border-color: var(--bdx); border-radius: 0; border-width: 3px; } .pdot.b-yl { border-color: var(--byl); border-radius: 50%; border-width: 3px; }
.lname .bmini { width: 1rem; height: 1rem; font-size: .6rem; }
@media (max-width: 760px) {
  .btab { font-size: .76rem; padding: .36rem .1rem; }
  .btab .bmini { display: none; }
  .legend .legend-chip:last-child { display: none; }
}

</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>竹北建商建案地圖 · 坤山／德鑫／椰林</h1>
          <p class="subtitle"><span id="count-pill">—</span><span class="hint-d"> · 點標籤看實價登錄與在售物件</span></p>
        </div>
      </div>
      <div class="legend" aria-label="圖例">
        <span class="legend-chip"><i class="dot e1"></i>2010 前</span>
        <span class="legend-chip"><i class="dot e2"></i>2010–2017</span>
        <span class="legend-chip"><i class="dot e3"></i>2018 後</span>
        <span class="legend-chip"><i class="dot pre"></i>預售</span>
        <span class="legend-chip"><i class="sale-chip">售2</i>在售戶數</span>
        <span class="legend-chip"><i class="star">★</i>坤德知之</span>
        <span class="legend-chip"><i class="bmini b-ks">坤</i><i class="bmini b-dx">德</i><i class="bmini b-yl">椰</i>建商</span>
      </div>
      <nav class="btabs" role="tablist" aria-label="切換建商">
        <button type="button" role="tab" class="btab active" aria-selected="true" data-b="all">全部 <small></small></button>
        <button type="button" role="tab" class="btab" aria-selected="false" data-b="ks"><i class="bmini b-ks">坤</i>坤山 <small></small></button>
        <button type="button" role="tab" class="btab" aria-selected="false" data-b="dx"><i class="bmini b-dx">德</i>德鑫 <small></small></button>
        <button type="button" role="tab" class="btab" aria-selected="false" data-b="yl"><i class="bmini b-yl">椰</i>椰林 <small></small></button>
      </nav>
    </header>

    <div class="workspace">
      <section class="map-pane" aria-label="地圖">
        <div id="map" role="application" aria-label="建商建案地圖"></div>
      </section>

      <aside class="side-pane" id="sheet">
        <button type="button" class="sheet-handle" id="sheet-handle" aria-label="展開／收合清單"><span></span><b id="sheet-title">建案清單</b></button>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" class="tab active" data-view="projects">建案 <small id="n-proj"></small></button>
          <button type="button" role="tab" class="tab" data-view="listings">在售物件 <small id="n-list"></small></button>
        </div>
        <div class="controls" id="controls-projects">
          <div class="row2">
            <label class="field"><span>排序</span>
              <select id="sort-by">
                <option value="year" selected>完工年 · 舊→新</option>
                <option value="year-desc">完工年 · 新→舊</option>
                <option value="unit-asc">單價 · 低→高</option>
                <option value="unit-desc">單價 · 高→低</option>
                <option value="sale">有待售優先</option>
              </select>
            </label>
            <label class="field"><span>區域</span>
              <select id="zone-filter"><option value="all">全部區域</option></select>
            </label>
          </div>
          <div class="checks">
            <label class="field-check"><input type="checkbox" id="f-sale" /> <span>只看有待售</span></label>
            <label class="field-check"><input type="checkbox" id="f-4000" /> <span>只看 4,000 萬以下待售</span></label>
            <label class="field-check"><input type="checkbox" id="f-32" /> <span>室內 ≥ 32 坪</span></label>
          </div>
        </div>
        <div class="controls" id="controls-listings" hidden>
          <div class="row2">
            <label class="field"><span>排序</span>
              <select id="lsort">
                <option value="price-asc" selected>總價 · 低→高</option>
                <option value="price-desc">總價 · 高→低</option>
                <option value="inner-desc">室內 · 大→小</option>
                <option value="ppi-asc">每室內坪 · 低→高</option>

    }
    if (p.notes.length) {
      h += '<div class="sec"><h4>注意事項</h4><ul class="notes">' + p.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>';
    }
    h += '<div class="geo">座標：' + esc(p.geoMethod) + '</div>';
    h += '</div>';
    if (p.links.length) {
      h += '<div class="btns">' + p.links.map(function (k) {
        var cls = k.kind === 'leju' ? 'leju' : (k.kind === '591' ? 'b591' : 'sinyi');
        return '<a class="btn ' + cls + '" href="' + esc(k.url) + '" target="_blank" rel="noopener">' + esc(k.label) + ' ↗</a>';
      }).join('') + '</div>';
    }
    h += '</div>';
    return h;
  }

  function popupOpts() {
    var w = Math.min(330, window.innerWidth - 36);
    var pad = mobile() ? [10, sheetVisiblePx() + 10] : [20, 20];
    return { maxWidth: w, minWidth: Math.min(260, w), autoPanPaddingTopLeft: [10, 60], autoPanPaddingBottomRight: pad, closeButton: true };
  }

  P.forEach(function (p) {
    var mk = window.L.marker([p.lat, p.lng], { icon: makeIcon(p), riseOnHover: true, title: p.name, keyboard: true });
    mk.bindPopup(function () { return popupHtml(p); }, popupOpts());
    mk.on('click', function () { setActive(p.id, false); });
    mk.on('popupopen', function () { mk.getPopup().options.autoPanPaddingBottomRight = popupOpts().autoPanPaddingBottomRight; });
    mk.on('popupclose', function () { if (activeId === p.id) setActive(null, false); });
    mk.addTo(map);
    markers[p.id] = mk;
  });
  map.on('zoomend', refreshIcons);
  function refreshIcons() { declutter(); P.forEach(function (p) { markers[p.id].setIcon(makeIcon(p)); }); }

  function setActive(id, fromList) {
    var prev = activeId; activeId = id;
    refreshIcons();
    [prev, id].forEach(function (x) { if (x && markers[x]) markers[x].setZIndexOffset(x === id ? 1000 : 0); });
    document.querySelectorAll('.card').forEach(function (c) { c.classList.toggle('active', c.dataset.id === id); });
    if (id && !fromList) {
      var c = document.querySelector('.card[data-id="' + id + '"]');
      if (c && !mobile()) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
  function flyTo(id) {
    var p = byId[id], mk = markers[id];
    if (!map.hasLayer(mk)) mk.addTo(map);
    if (mobile()) setSheet('collapsed');
    setActive(id, true);
    var z = Math.max(map.getZoom(), 16);
    var target = window.L.latLng(p.lat, p.lng);
    if (mobile()) {
      var pt = map.project(target, z).add([0, -Math.round(window.innerHeight * 0.18)]);
      target = map.unproject(pt, z);
    }
    map.flyTo(target, z, { duration: 0.6 });
    map.once('moveend', function () { mk.openPopup(); });
  }

  // ---------- filters ----------
  var $ = function (id) { return document.getElementById(id); };
  var zones = []; P.slice().sort(function (a, b) { return a.zone > b.zone ? 1 : -1; }).forEach(function (p) { if (zones.indexOf(p.zone) < 0) zones.push(p.zone); });
  zones.forEach(function (z) { var o = document.createElement('option'); o.value = z; o.textContent = z; $('zone-filter').appendChild(o); });
  function innerOk(l) { return l.inner != null ? l.inner >= 32 : (l.main != null && l.main >= 31.5); }
  function passes(p) {
    var z = $('zone-filter').value, ls = listingsOf(p);
    if (!bOk(p.builder)) return false;
    if (z !== 'all' && p.zone !== z) return false;
    if ($('f-sale').checked && !ls.length) return false;
    var u4 = $('f-4000').checked, i32 = $('f-32').checked;
    if (u4 && i32) return ls.some(function (l) { return l.total <= 4000 && innerOk(l); });
    if (u4 && !ls.some(function (l) { return l.total <= 4000; })) return false;
    if (i32 && !((p.innerMax != null && p.innerMax >= 32) || ls.some(innerOk))) return false;
    return true;
  }
  function sorted(arr) {
    var s = $('sort-by').value, a = arr.slice();
    var yk = function (p) { return p.year || 9999; };
    if (s === 'year') a.sort(function (x, y) { return yk(x) - yk(y) || (x.done > y.done ? 1 : -1); });
    if (s === 'year-desc') a.sort(function (x, y) { return yk(y) - yk(x) || (x.done < y.done ? 1 : -1); });
    if (s === 'unit-asc') a.sort(function (x, y) { return (x.unitSort || 999) - (y.unitSort || 999); });
    if (s === 'unit-desc') a.sort(function (x, y) { return (y.unitSort || 0) - (x.unitSort || 0); });
    if (s === 'sale') a.sort(function (x, y) { return y.listings.length - x.listings.length || yk(x) - yk(y); });
    return a;
  }

  var view = 'projects';
  function render() {
    var vis = P.filter(passes);
    P.forEach(function (p) { var on = vis.indexOf(p) >= 0, mk = markers[p.id]; if (on && !map.hasLayer(mk)) mk.addTo(map); if (!on && map.hasLayer(mk)) map.removeLayer(mk); });
    refreshIcons();
    var PB = P.filter(function (p) { return bOk(p.builder); }), LB = L.filter(function (l) { return bOk(l.builder); });
    $('count-pill').textContent = (bsel === 'all' ? '三家建商' : BN[bsel]) + ' ' + PB.length + ' 案（顯示 ' + vis.length + '）· 在售 ' + LB.length + ' 戶 · 符合 ' + LB.filter(function (l) { return l.fit; }).length;
    $('n-proj').textContent = vis.length + '/' + PB.length;
    $('n-list').textContent = LB.length;
    if (view === 'projects') renderProjects(sorted(vis)); else renderListings();
  }
  function renderProjects(arr) {
    var box = $('list');
    if (!arr.length) { box.innerHTML = '<div class="empty">沒有符合條件的建案</div>'; return; }
    box.innerHTML = arr.map(function (p) {
      var ls = listingsOf(p), fit = ls.filter(function (l) { return l.fit; }).length;
      var t = p.latest;
      return '<div class="card ' + p.era + (p.star ? ' star-card' : '') + (p.id === activeId ? ' active' : '') + '" data-id="' + p.id + '" tabindex="0">' +
        '<div class="card-head"><p class="cname">' + (p.star ? '<span class="star">★</span>' : '') + esc(p.name) + '<span class="cyear">' + esc(p.era === 'pre' ? '預售 ' + (p.year || '') : (p.year || '年份未知')) + '</span></p>' +
        '<span class="cunit">' + (p.unitLabel ? esc(p.unitLabel) + '<small> 萬/坪' + (p.unitEst ? '(估)' : '') + '</small>' : '—') + '</span></div>' +
        '<div class="cmeta"><span class="tag tag-b b-' + p.builder + '">' + esc(BN[p.builder]) + '</span><span class="tag tag-zone">' + esc(p.zone) + '</span>' +
        '<span class="tag">室內 ' + esc(p.innerRange) + '</span>' +
        (t ? '<span class="tag">最新 ' + esc(t.date.slice(0, 7)) + ' ' + wan(t.total) + '</span>' : '<span class="tag tag-est">尚無實登</span>') +
        (ls.length ? '<span class="tag tag-sale">售' + ls.length + '</span>' : '') +
        (fit ? '<span class="tag tag-fit">≤4,000萬·≥32坪 ×' + fit + '</span>' : '') + '</div></div>';
    }).join('');
  }
  function renderListings() {
    var s = $('lsort').value, a = L.filter(function (l) { return bOk(l.builder); });
    if ($('f-fit').checked) a = a.filter(function (l) { return l.fit; });
    var inn = function (l) { return l.inner != null ? l.inner : (l.main || 0); };
    if (s === 'price-asc') a.sort(function (x, y) { return x.total - y.total; });
    if (s === 'price-desc') a.sort(function (x, y) { return y.total - x.total; });
    if (s === 'inner-desc') a.sort(function (x, y) { return inn(y) - inn(x); });
    if (s === 'ppi-asc') a.sort(function (x, y) { return x.total / (inn(x) || 1) - y.total / (inn(y) || 1); });
    var box = $('list');
    if (!a.length) { box.innerHTML = '<div class="empty">沒有符合條件的物件</div>'; return; }
    box.innerHTML = a.map(function (l) {
      var p = byId[l.pid], ppi = l.inner != null ? fmt(l.total / l.inner, 1) + '萬' : '—';
      return '<div class="lcard' + (l.fit ? ' fit' : '') + '">' +
        '<div class="lcard-top"><span class="lname" data-pid="' + p.id + '"><i class="bmini b-' + p.builder + '">' + BCH[p.builder] + '</i>' + esc(p.name) + ' ' + esc(l.floor) + '</span>' +
        '<a class="lprice ' + (l.total <= 4000 ? 'u4000' : 'o4000') + '" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + wan(l.total) + '</a></div>' +
        '<div class="lgrid"><div><span>權狀(含車位)</span><b>' + fmt(l.own) + '坪</b></div>' +
        '<div><span>室內(主+附)</span><b>' + (l.inner != null ? fmt(l.inner) + '坪' : '未知') + '</b></div>' +
        '<div><span>每室內坪</span><b>' + ppi + '</b></div></div>' +
        '<div class="lnote">' + esc(p.year ? p.year + ' 完工' : '') + ' · ' + esc(String(l.rooms).match(/^\d+$/) ? l.rooms + '房' : l.rooms) + ' · 車位 ' + esc(l.park) + ' · ' + esc(l.src) +
        (l.priceHist ? '<br>曾見價格：' + esc(l.priceHist) : '') + (l.innerNote ? '<br>' + esc(l.innerNote) : (l.innerSrc ? '<br>室內坪：' + esc(l.innerSrc) : '')) + '</div></div>';
    }).join('');
  }

  $('list').addEventListener('click', function (e) {
    var c = e.target.closest('.card'); if (c) { flyTo(c.dataset.id); return; }
    var n = e.target.closest('.lname'); if (n) flyTo(n.dataset.pid);
  });
  $('list').addEventListener('keydown', function (e) { var c = e.target.closest('.card'); if (c && e.key === 'Enter') flyTo(c.dataset.id); });
  ['sort-by', 'zone-filter', 'f-sale', 'f-4000', 'f-32', 'lsort', 'f-fit'].forEach(function (id) { $(id).addEventListener('change', render); });
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      view = t.dataset.view;
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('active', x === t); });
      $('controls-projects').hidden = view !== 'projects';
      $('controls-listings').hidden = view !== 'listings';
      $('sheet-title').textContent = view === 'projects' ? '建案清單' : '在售物件';
      if (mobile()) setSheet('expanded');
      render();
    });
  });

  function fitVisible() {
    var vis = P.filter(passes); if (!vis.length) return;
    var b = window.L.latLngBounds(vis.map(function (p) { return [p.lat, p.lng]; }));
    map.fitBounds(b, mobile() ? { paddingTopLeft: [36, 36], paddingBottomRight: [36, Math.round(window.innerHeight * 0.34) + 4], maxZoom: 16 } : { paddingTopLeft: [30, 40], paddingBottomRight: [30, 30], maxZoom: 16 });
  }
  document.querySelectorAll('.btab').forEach(function (t) {
    t.addEventListener('click', function () {
      bsel = t.dataset.b; map.closePopup(); activeId = null;
      document.querySelectorAll('.btab').forEach(function (x) { var on = x === t; x.classList.toggle('active', on); x.setAttribute('aria-selected', on ? 'true' : 'false'); });
      render(); fitVisible();
    });
  });
  document.querySelectorAll('.btab').forEach(function (t) {
    var b = t.dataset.b, n = P.filter(function (p) { return b === 'all' || p.builder === b; }).length;
    t.querySelector('small').textContent = n;
  });

  // ---------- bottom sheet (mobile) ----------
  function setSheet(state) {
    sheet.classList.remove('expanded', 'collapsed');
    if (state !== 'peek') sheet.classList.add(state);
    sheet.dataset.state = state;
  }
  function sheetVisiblePx() {
    if (!mobile()) return 0;
    var st = sheet.dataset.state || 'peek';
    if (st === 'collapsed') return 52;
    if (st === 'expanded') return window.innerHeight * 0.82;
    return window.innerHeight * 0.34;
  }
  setSheet('peek');
  $('sheet-handle').addEventListener('click', function () {
    var st = sheet.dataset.state;
    setSheet(st === 'peek' ? 'expanded' : st === 'expanded' ? 'collapsed' : 'peek');
  });
  // simple swipe on handle
  var y0 = null;
  $('sheet-handle').addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; }, { passive: true });
  $('sheet-handle').addEventListener('touchend', function (e) {
    if (y0 == null) return; var dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (Math.abs(dy) < 30) return;
    var st = sheet.dataset.state;
    if (dy < 0) setSheet(st === 'collapsed' ? 'peek' : 'expanded'); else setSheet(st === 'expanded' ? 'peek' : 'collapsed');
    e.preventDefault();
  });
  map.on('click', function () { if (mobile() && sheet.dataset.state === 'expanded') setSheet('peek'); });

  // ---------- footer ----------
  $('foot').innerHTML =
    '<p><b>資料來源：</b>建商官網業績（<a href="https://www.kuensun.com.tw/works" target="_blank" rel="noopener">坤山</a>、<a href="https://www.dexinhouse.com.tw/classic/all/" target="_blank" rel="noopener">德鑫</a>、<a href="https://www.grandconstruction.com.tw/program.php" target="_blank" rel="noopener">椰林</a>）；JR 預售屋資訊站椰林各區整理；' + esc(D.meta.lvr) + '；591（社區頁與售屋）；信義社區頁（坤山在售、建商核對）。樂居被 Cloudflare 擋住，德鑫／椰林的在售只收 591，信義、永慶獨家委託可能漏列。查詢日 ' + esc(D.meta.generated) + '。</p>' +
    '<p><b>單價：</b>' + esc(D.meta.formula) + '</p>' +
    '<p><b>室內坪：</b>' + esc(D.meta.innerDef) + '</p>' +
    '<p><b>座標：</b>採 591／信義社區頁內嵌座標（少數無社區頁者用 591 門牌點），全部以 OpenStreetMap 反查確認位於竹北市。</p>' +
    '<p><b>標記：</b>標籤左側字樣與外框顏色＝建商（坤＝棕、德＝紅方角、椰＝綠圓角）；底色＝完工年代；紅色「售N」＝在售戶數。</p>' +
    '<p class="warn">室內坪多為推估，看屋或出價前請以建物謄本核對主建物、附屬建物與車位坪數。</p>' +
    '<p>新竹縣總價 ≥ 4,000 萬屬高價住宅：貸款最多 3 成、無寬限期。</p>';

  render();
  var b = window.L.latLngBounds(P.map(function (p) { return [p.lat, p.lng]; }));
  map.fitBounds(b, mobile() ? { paddingTopLeft: [36, 36], paddingBottomRight: [36, Math.round(window.innerHeight * 0.34) + 4] } : { paddingTopLeft: [30, 40], paddingBottomRight: [30, 30] });
  window.KS_APP = { map: map, markers: markers, flyTo: flyTo, setSheet: setSheet };
})();
</script>
</body>
</html>
